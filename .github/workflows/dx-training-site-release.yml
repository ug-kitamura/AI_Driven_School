name: DX Training Mandala Release

# 公開サイトのリリース。main に含まれるコミットへ v* タグを打ったときだけ走る。
# GitHub Pages（サブパス配信）と Vercel（ルート配信）へ、同じコミットから配信する。

on:
  push:
    tags:
      - "v*"

concurrency:
  group: dx-training-site-release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# 配信先に依存する値はここにまとめる。
# 将来「成果物のみを専用 public リポへ push」へ切り替える場合も、変更はこの env と
# deploy ジョブに閉じ、site/ のコードと変換スクリプトには手を入れない。
env:
  NODE_VERSION: "24"
  SITE_DIR: dx-training-studio/site
  # GitHub Pages はプロジェクトページ配信なのでサブパスになる
  PAGES_BASE_PATH: /AI_Driven_School
  PAGES_ARTIFACT_DIR: _pages_out
  VERCEL_ARTIFACT_DIR: _vercel_out

jobs:
  build:
    name: Verify tag and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # タグと main の関係を調べるため全履歴が要る
          fetch-depth: 0

      # タグはブランチに紐付かないため、作業ブランチのコミットにタグを打っても発火する。
      # main に含まれないコミットからは公開しない。
      - name: Verify the tag is on main
        run: |
          git fetch origin main --quiet
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "タグ ${GITHUB_REF_NAME} は main に含まれるコミットを指しています"
          else
            echo "::error::タグ ${GITHUB_REF_NAME} が指すコミットは main に含まれていません。公開を中止します"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dx-training-studio/site/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SITE_DIR }}
        run: npm ci

      # basePath の有無が違うため、配信先ごとにビルドする。
      # 同じ checkout から作るので、両者の内容は必ず一致する。
      - name: Build for GitHub Pages
        working-directory: ${{ env.SITE_DIR }}
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          NEXT_PUBLIC_SITE_RELEASE: ${{ github.ref_name }}
        run: |
          npm run build
          # artifact 方式では不要だが、将来ブランチ配信へ切り替えたときに
          # Jekyll が _next/ を無視して 404 になるのを防ぐ
          touch out/.nojekyll
          mv out "${GITHUB_WORKSPACE}/${PAGES_ARTIFACT_DIR}"

      - name: Build for Vercel
        working-directory: ${{ env.SITE_DIR }}
        env:
          NEXT_PUBLIC_SITE_RELEASE: ${{ github.ref_name }}
        run: |
          npm run build
          mv out "${GITHUB_WORKSPACE}/${VERCEL_ARTIFACT_DIR}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PAGES_ARTIFACT_DIR }}

      - name: Upload Vercel artifact
        uses: actions/upload-artifact@v7
        with:
          name: vercel-out-${{ github.run_id }}
          path: ${{ env.VERCEL_ARTIFACT_DIR }}
          if-no-files-found: error

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deploy-pages
        uses: actions/deploy-pages@v5

  deploy-vercel:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: vercel-out-${{ github.run_id }}
          path: ${{ env.VERCEL_ARTIFACT_DIR }}

      # Secrets 未登録でもリリース全体は失敗させない（Pages だけで完結させる）
      - name: Check Vercel credentials
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::notice::VERCEL_TOKEN が未登録のため Vercel へのデプロイをスキップします"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      # ビルド済みの静的成果物をそのまま配る（Vercel 側でビルドしない）。
      # Pages と同一の成果物であることを保証するため。
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest deploy "${VERCEL_ARTIFACT_DIR}" \
            --prod \
            --yes \
            --token "${VERCEL_TOKEN}" \
            --archive=tgz
